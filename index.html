<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFF9EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://pocket-swap.onrender.com/" />
    <title>PocketSwap — Cozy Local Item Trade-Off Game (0% Cash Barter App)</title>
    <meta name="description" content="Swap real-life items in your neighborhood like a Cozy RPG! Pack up to 20 items in your Pocket across 12 categories (Gaming, Gadgets, Books, Plants, Collectibles), scan the live GPS Radar, and trade locally with zero cash." />
    <meta name="keywords" content="local barter app, swap items locally, trade items without cash, buy nothing app, local trade game, swap retro games, neighborhood barter, PocketSwap" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PocketSwap" />
    <meta property="og:url" content="https://pocket-swap.onrender.com/" />
    <meta property="og:title" content="PocketSwap — Cozy Local Item Trade-Off Game 🌿🎒" />
    <meta property="og:description" content="Trade real-life items in your neighborhood with zero cash. Pack your 20-slot Pocket Inventory across 12 categories, scan the Cozy Island & OpenStreetMap Radar, and earn Karma!" />
    <meta property="og:image" content="https://pocket-swap.onrender.com/og-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PocketSwap — Cozy Local Item Trade-Off Game 🌿🎒" />
    <meta name="twitter:description" content="Trade real-life items in your neighborhood with zero cash. Pack your 20-slot Pocket Inventory across 12 categories!" />
    <meta name="twitter:image" content="https://pocket-swap.onrender.com/og-preview.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "PocketSwap",
            "url": "https://pocket-swap.onrender.com/",
            "applicationCategory": "GameApplication, LifestyleApplication",
            "operatingSystem": "Web, iOS, Android",
            "description": "Cozy local item trade-off game and neighborhood barter app. Pack up to 20 items in your Pocket Inventory across 12 categories and swap locally with 0% cash.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How does PocketSwap work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Pack up to 20 real-life items you want to trade into your Pocket Inventory across 12 categories (Gaming, Gadgets, Collectibles, Fashion, Books & Art, Home & Cozy, Music, Sports, Toys, Crafts, Baby & Kids, Tools & Garden). Browse nearby items on the live GPS radar, propose a 1-for-1 or bundle swap, and verify your meetup with a 4-digit PIN."
                }
              },
              {
                "@type": "Question",
                "name": "Is PocketSwap completely free with zero cash?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes! PocketSwap enforces a strict 0% Cash Barter Rule. Every trade is pure item-for-item swapping in safe daytime public zones."
                }
              }
            ]
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#EADBC0] text-[#5C4328] antialiased selection:bg-[#4E9F6E] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
